name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exercise the oldest and newest OTP supported by Elixir 1.18.
          - elixir: "1.18"
            otp: "25"
          - elixir: "1.18"
            otp: "27"
          - elixir: "1.19"
            otp: "28"
          - elixir: "1.20"
            otp: "27"
          # Unlike "latest", "> 0" excludes prereleases in setup-beam.
          - elixir: "> 0"
            otp: "> 0"
            quality: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # Cache dependencies only, so project code is compiled on every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}

      - name: Fetch dependencies
        run: mix deps.get --check-locked

      - name: Check formatting
        if: matrix.quality
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Test with warnings as errors
        run: mix test --warnings-as-errors

      - name: Check optional Cowboy compatibility warning
        if: matrix.quality
        env:
          MIX_ENV: prod
          MIX_INSTALL_DIR: ${{ runner.temp }}/reverse-it-cowboy
        run: elixir examples/cowboy_warning.exs
